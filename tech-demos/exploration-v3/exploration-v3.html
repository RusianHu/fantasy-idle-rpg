<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151614">
<meta name="build-id" content="20260801.2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23151614'/%3E%3Cpath d='M2 12V5h3l3-3 3 3h3v7H2z' fill='%23d4b65f'/%3E%3Crect x='7' y='8' width='2' height='4' fill='%23151614'/%3E%3C/svg%3E">
<title data-demo-page-title="explore.pageTitle">开放探索 v3 生成器审计 · 幻境远征</title>
<link rel="stylesheet" href="exploration-v3.css?v=20260801.2">
</head>
<body>
<main>
  <header class="page-header">
    <div>
      <p class="eyebrow">FANTASY IDLE RPG / GENERATOR AUDIT / V3</p>
      <h1 data-demo-i18n="explore.title">开放探索 v3 生成器审计</h1>
      <p data-demo-i18n="explore.subtitle">宏观图、硬阻挡、分段长途寻路、内容角色与结构验证</p>
    </div>
    <div class="page-actions">
      <label class="locale-control"><span data-demo-i18n="common.language">语言</span>
        <select data-demo-locale><option value="zh-CN">简体中文</option><option value="en">English</option></select>
      </label>
      <a href="../index.html" data-demo-i18n="common.demoHub">演示中心</a>
      <a href="../../index.html" data-demo-i18n="common.backGame">返回游戏</a>
    </div>
  </header>
  <section class="controls">
    <label><span data-demo-i18n="common.region">区域</span><select id="region"></select></label>
    <label><span data-demo-i18n="common.seed">世界种子</span><input id="seed" maxlength="8" value="12345678"></label>
    <button id="generate" type="button" data-demo-i18n="common.generate">生成</button>
    <button id="audit" type="button" data-demo-i18n="explore.audit">批量审计 32 种子</button>
    <output id="audit-status" data-demo-i18n="explore.auditIdle">可对当前区域连续验证 32 个确定性种子。</output>
  </section>
  <section class="metrics" id="metrics"></section>
  <section class="canvas-wrap">
    <canvas id="layout" width="1200" height="720"></canvas>
    <aside>
      <label><input id="show-distance" type="checkbox"> <span data-demo-i18n="explore.distance">距离场</span></label>
      <label><input id="show-graph" type="checkbox" checked> <span data-demo-i18n="explore.graph">宏观拓扑</span></label>
      <label><input id="show-route" type="checkbox" checked> <span data-demo-i18n="explore.route">营地—巢穴长途路径</span></label>
      <label><input id="show-auto-route" type="checkbox" checked> <span data-demo-i18n="explore.autoRoute">自动中断足迹</span></label>
      <label><input id="show-content" type="checkbox" checked> <span data-demo-i18n="explore.content">内容角色</span></label>
      <label><input id="show-chunks" type="checkbox" checked> <span data-demo-i18n="explore.chunks">区块边界</span></label>
      <div class="legend" aria-label="地图标识" data-demo-i18n-aria="explore.legendAria">
        <span><canvas width="18" height="18" data-map-icon="camp" aria-hidden="true"></canvas><b data-demo-i18n="explore.camp">营地</b></span>
        <span><canvas width="18" height="18" data-map-icon="landmark" aria-hidden="true"></canvas><b data-demo-i18n="explore.landmark">地标</b></span>
        <span><canvas width="18" height="18" data-map-icon="resource" aria-hidden="true"></canvas><b data-demo-i18n="explore.resource">资源</b></span>
        <span><canvas width="18" height="18" data-map-icon="curio" aria-hidden="true"></canvas><b data-demo-i18n="explore.curio">奇物</b></span>
        <span><canvas width="18" height="18" data-map-icon="ecology" aria-hidden="true"></canvas><b data-demo-i18n="explore.ecology">生态</b></span>
        <span><canvas width="18" height="18" data-map-icon="threat" aria-hidden="true"></canvas><b data-demo-i18n="explore.threat">威胁</b></span>
        <span><canvas width="18" height="18" data-map-icon="guardian" aria-hidden="true"></canvas><b data-demo-i18n="explore.guardian">守门精英</b></span>
        <span><canvas width="18" height="18" data-map-icon="lair" aria-hidden="true"></canvas><b data-demo-i18n="explore.lair">Boss 巢穴</b></span>
        <span><canvas width="18" height="18" data-map-icon="merchant" aria-hidden="true"></canvas><b data-demo-i18n="explore.merchant">移动行商</b></span>
        <span><canvas width="18" height="18" data-map-icon="hero" aria-hidden="true"></canvas><b data-demo-i18n="explore.hero">冒险者</b></span>
      </div>
    </aside>
  </section>
  <section class="auto-audit" aria-labelledby="auto-audit-title">
    <div class="audit-heading">
      <div>
        <p class="eyebrow">AUTO MODE / INTERRUPTION AUDIT</p>
        <h2 id="auto-audit-title" data-demo-i18n="explore.autoTitle">自动模式中断审计</h2>
      </div>
      <output id="auto-status" role="status" data-demo-i18n="explore.autoIdle">等待运行场景。</output>
    </div>
    <div class="audit-controls">
      <label><span data-demo-i18n="explore.scenario">场景</span>
        <select id="auto-scenario" data-testid="auto-scenario">
          <option value="gather-resume" data-demo-i18n="explore.scenarioGather">采集后续行</option>
          <option value="chest-resume" data-demo-i18n="explore.scenarioChest">开箱后续行</option>
          <option value="gather-threat" data-demo-i18n="explore.scenarioThreat">采集中接敌</option>
          <option value="chest-expiry" data-demo-i18n="explore.scenarioExpiry">途中宝箱过期</option>
          <option value="gather-fallback" data-demo-i18n="explore.scenarioGatherFallback" selected>采集路径失败缓存</option>
          <option value="chest-fallback" data-demo-i18n="explore.scenarioChestFallback">宝箱路径失败缓存</option>
        </select>
      </label>
      <label><span data-demo-i18n="explore.policy">恢复策略</span>
        <select id="auto-policy" data-testid="auto-policy">
          <option value="compare" data-demo-i18n="explore.policyCompare" selected>修复前 / 修复后对照</option>
          <option value="legacy" data-demo-i18n="explore.policyLegacy">修复前基线</option>
          <option value="current" data-demo-i18n="explore.policyCurrent">修复后生产逻辑</option>
        </select>
      </label>
      <button id="run-auto" type="button" data-testid="run-auto" data-demo-i18n="explore.runAuto">运行场景</button>
      <button id="audit-auto" type="button" data-testid="audit-auto" data-demo-i18n="explore.auditAuto">批量评估 32 种子</button>
    </div>
    <div class="auto-metrics" id="auto-metrics"></div>
    <div class="audit-results">
      <div class="event-table-wrap">
        <table class="event-table">
          <thead>
            <tr>
              <th data-demo-i18n="explore.logTime">时间</th>
              <th data-demo-i18n="explore.logPolicy">策略</th>
              <th data-demo-i18n="explore.logEvent">事件</th>
              <th data-demo-i18n="explore.logState">状态</th>
              <th data-demo-i18n="explore.logDistance">剩余</th>
              <th data-demo-i18n="explore.logNav">导航</th>
            </tr>
          </thead>
          <tbody id="auto-log"></tbody>
        </table>
      </div>
      <pre id="auto-report" data-testid="auto-report"></pre>
    </div>
  </section>
  <pre id="report"></pre>
</main>
