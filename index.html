<body>
<div id="app">
  <!-- 顶部状态栏 -->
  <header id="hud">
    <div id="hud-avatar">
      <canvas id="avatar-canvas" width="40" height="40"></canvas>
      <div id="hud-level" class="lv-badge">1</div>
    </div>
    <div id="hud-mid">
      <div class="bar hp"><div class="bar-fill" id="hud-hp-fill"></div><span class="bar-text" id="hud-hp-text"></span></div>
      <div class="bar exp"><div class="bar-fill" id="hud-exp-fill"></div><span class="bar-text" id="hud-exp-text"></span></div>
    </div>
    <div id="hud-cur">
      <div class="cur-row"><canvas class="cur-icon" id="icon-gold" width="16" height="16"></canvas><span id="hud-gold">0</span></div>
      <div class="cur-row"><canvas class="cur-icon" id="icon-crystal" width="16" height="16"></canvas><span id="hud-crystal">0</span></div>
    </div>
  </header>

  <!-- 中部世界舞台 -->
  <main id="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="battle-overlay">
      <div id="region-chip">
        <span class="region-sigil" aria-hidden="true"></span>
        <span class="region-copy">
          <span id="region-kicker" class="region-kicker"></span>
          <strong id="region-name" class="region-name"></strong>
        </span>
      </div>
      <div id="hunt-gauge" class="gauge"><div id="hunt-fill"></div><span id="hunt-text"></span></div>
      <div id="hunt-actions" class="hunt-actions">
        <button id="btn-boss-hunt" class="btn boss-hunt-button" type="button">
          <canvas id="boss-hunt-icon" width="18" height="18" aria-hidden="true"></canvas>
          <span id="boss-hunt-label"></span>
        </button>
        <button id="auto-boss-switch" class="auto-boss-switch on" type="button" role="switch" aria-checked="true">
          <span id="auto-boss-label" class="auto-boss-label"></span>
          <span class="auto-boss-track" aria-hidden="true"><span class="auto-boss-knob"></span></span>
        </button>
      </div>
      <div id="boss-bar" class="hidden">
        <div id="boss-name"></div>
        <div class="bar boss"><div class="bar-fill" id="boss-hp-fill"></div></div>
      </div>
      <section id="combat-v2-hud" class="combat-v2-hud hidden" aria-live="polite">
        <div class="combat-v2-party" id="combat-v2-party">
          <div class="combat-v2-party-members" id="combat-v2-party-members"></div>
          <canvas id="combat-v2-party-portrait" class="combat-v2-portrait combat-v2-portrait-ally"
            width="48" height="48"></canvas>
        </div>
        <div class="combat-v2-center">
          <div class="combat-v2-action">
            <span id="combat-v2-action-name"></span>
            <div class="combat-v2-action-track"><i id="combat-v2-action-fill"></i></div>
            <small id="combat-v2-gcd"></small>
          </div>
          <div class="combat-v2-resource">
            <span id="combat-v2-resource-name"></span>
            <div class="combat-v2-resource-track"><i id="combat-v2-resource-fill"></i></div>
            <small id="combat-v2-combo"></small>
          </div>
          <div id="combat-v2-statuses" class="combat-v2-statuses"></div>
        </div>
        <div class="combat-v2-enemy">
          <div class="combat-v2-enemy-copy">
            <strong id="combat-v2-enemy-name"></strong>
            <span id="combat-v2-enemy-cast"></span>
            <div class="combat-v2-cast-track"><i id="combat-v2-enemy-cast-fill"></i></div>
            <small id="combat-v2-phase"></small>
          </div>
          <canvas id="combat-v2-enemy-portrait" class="combat-v2-portrait combat-v2-portrait-enemy"
            width="48" height="48"></canvas>
        </div>
        <div id="combat-v2-telegraph" class="combat-v2-telegraph"></div>
        <div id="combat-v2-strategy" class="combat-v2-strategy" role="group">
          <button type="button" data-combat-strategy="safe"></button>
          <button type="button" data-combat-strategy="balanced"></button>
          <button type="button" data-combat-strategy="aggressive"></button>
          <button type="button" id="combat-v2-tactics"></button>
        </div>
      </section>
      <div id="buff-chips"></div>
      <div id="expedition-hud" class="expedition-hud">
        <button id="expedition-strategy" class="expedition-strategy" type="button">
          <canvas id="expedition-strategy-icon" width="18" height="18" aria-hidden="true"></canvas>
          <span id="expedition-strategy-label"></span>
        </button>
        <div class="expedition-intent">
          <span id="expedition-intent-label"></span>
          <strong id="expedition-intent-target"></strong>
        </div>
        <div class="expedition-readiness" aria-live="polite">
          <span id="expedition-readiness-label"></span>
          <strong id="expedition-readiness-value"></strong>
        </div>
      </div>
      <button id="control-switch" class="control-switch" type="button" role="switch" aria-checked="false">
        <span class="control-glyph" aria-hidden="true">
          <canvas id="control-mode-icon" width="18" height="18"></canvas>
        </span>
        <span class="control-copy">
          <span id="control-title" class="control-title"></span>
          <strong id="control-mode-label" class="control-mode-label"></strong>
        </span>
        <span class="control-track" aria-hidden="true"><span class="control-knob"></span></span>
      </button>
      <button id="btn-camp" class="btn btn-camp" type="button">
        <canvas id="camp-action-icon" class="camp-action-icon" width="24" height="24" aria-hidden="true"></canvas>
        <span id="camp-action-label" class="camp-action-label"></span>
      </button>
      <button id="btn-potion" class="btn btn-potion" type="button">
        <canvas id="quick-potion-icon" width="22" height="22" aria-hidden="true"></canvas>
        <span id="quick-potion-label"></span>
        <span id="quick-potion-count"></span>
        <span id="quick-potion-cd"></span>
      </button>
      <button id="btn-trade" class="btn btn-trade hidden" type="button">
        <span class="trade-button-mark" aria-hidden="true"></span>
        <span id="trade-button-label"></span>
      </button>
    </div>
    <div id="transition-root" class="transition-root hidden" aria-live="polite"></div>
    <div id="panel-container" class="hidden">
      <div id="panel-inner"></div>
    </div>
    <div id="toasts"></div>
  </main>

  <!-- 底部 Tab 导航（JS 生成） -->
  <nav id="tabbar"></nav>
</div>
<div id="modal-root"></div>
