name: Apply bounded stage3 ending fix
on:
  push:
    branches: [codex/stage3-ending-transaction-20260916]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/stage3-ending-transaction-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/stage3-ending-transaction-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify baseline failure and apply exact source fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'b06e30fc630e2517e60ca33c1e5eb708e42b3ad498f9d74c7d9f96cc6dda6663  js/systems/world.js' | sha256sum --check
          if node tests/world-scene-ownership.test.js > /tmp/stage3-before.log 2>&1; then
            echo 'Regression control unexpectedly passed'; exit 1
          fi
          grep 'settlement must preserve scene ownership: ending/manual' /tmp/stage3-before.log
          cat /tmp/stage3-before.log
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/systems/world.js')
          old = "        var safeToPlan = Game.state.world.mode === 'battle' &&\n          W.hero.state !== 'dead' && W.hero.state !== 'recover' &&"
          new = "        // A lethal final-boss action can open the ending before this same\n        // tick settles the encounter. Settlement must not steal scene ownership.\n        var safeToPlan = Game.state.world.mode === 'battle' &&\n          !(Game.transitions && Game.transitions.isActive()) &&\n          !(Game.ending && Game.ending.isActive()) &&\n          W.hero.state !== 'dead' && W.hero.state !== 'recover' &&"
          s = p.read_text()
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          test "$(git hash-object js/systems/world.js)" = fabc352626a4a9af1af0755e6db0a6dc93205495
          node tests/world-scene-ownership.test.js
          git diff --check
      - name: Publish fix on this development branch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage3-ending-fix-once.yml
          git add js/systems/world.js
          git commit -m 'fix(world): preserve scene ownership during encounter settlement'
          git push origin HEAD:refs/heads/codex/stage3-ending-transaction-20260916
          echo "Published $(git rev-parse HEAD)"
