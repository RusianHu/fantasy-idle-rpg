# Include inside the yanshanlaosiji.top server block.
# HTML and the release manifest must always revalidate; versioned assets are immutable.

location = /fantasy-idle-rpg/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location ~* ^/fantasy-idle-rpg/.*\.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /fantasy-idle-rpg/version.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location ~* ^/fantasy-idle-rpg/.+\.(?:css|js|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}
